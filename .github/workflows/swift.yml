name: Windows RDP

on:
  workflow_dispatch:

jobs:

  rdp:

    runs-on: windows-latest

    timeout-minutes: 60


    steps:


    - name: 安装 Tailscale 并连接

      uses: tailscale/github-action@v4

      with:

        authkey: ${{ secrets.TS_AUTHKEY }}



    - name: 开启远程桌面

      shell: powershell

      run: |


        # 开启RDP

        Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0



        # 开启防火墙

        Enable-NetFirewallRule `
        -DisplayGroup "Remote Desktop"



    - name: 创建RDP用户

      shell: powershell

      run: |


        $Password = ConvertTo-SecureString `
        "${{ secrets.RDP_PASSWORD }}" `
        -AsPlainText `
        -Force


        New-LocalUser `
        -Name "rdpuser" `
        -Password $Password `
        -Description "Temporary RDP User"



        Add-LocalGroupMember `
        -Group "Administrators" `
        -Member "rdpuser"



    - name: 显示Tailscale IP

      shell: powershell

      run: |


        Write-Host "================================"

        Write-Host "RDP地址:"


        tailscale ip -4


        Write-Host "用户名: rdpuser"

        Write-Host "密码: 使用GitHub Secret RDP_PASSWORD"


        Write-Host "================================"



    - name: 保持运行1小时

      shell: powershell

      run: |


        Write-Host "Windows RDP运行中"


        for ($i = 0; $i -lt 60; $i++) {

          Write-Host "剩余 $((60-$i)) 分钟"

          Start-Sleep -Seconds 60

        }
